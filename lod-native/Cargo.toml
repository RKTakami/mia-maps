[package]
name = "lod-native"
version = "0.1.0"
edition = "2021"
description = "Persistent level-of-detail voxel store for the map."
license = "MIT"

[lib]
name = "lod_native"
# rlib so the pure logic stays unit-testable without a JVM; cdylib for the JNI surface.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Pure Rust throughout, so cross-compiling to every target stays free of a C toolchain.
redb = "2.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
jni = "0.21.1"

[profile.release]
opt-level = 3
