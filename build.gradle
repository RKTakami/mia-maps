plugins {
    id 'fabric-loom'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name "caffeinemcRepository"
                url "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    // Local loom mapping cache + sibling voxy-clone loom cache, derived at build time
    // (no hardcoded user paths). Override the voxy cache with -PvoxyLoomCache=... if it
    // lives elsewhere.
    maven { url = new File(System.getProperty('user.home'), ".gradle/caches/fabric-loom/minecraftMaven") }
    // This project's own loom caches. Loom writes the remapped Minecraft/fabric-api
    // artifacts here but does not always register them for resolution (seen on
    // Loom 1.16.3 + Gradle 9.4.1), so declare them explicitly.
    maven { url = new File(rootProject.projectDir, ".gradle/loom-cache/minecraftMaven") }
    maven { url = new File(rootProject.projectDir, ".gradle/loom-cache/remapped_mods") }
    maven {
        url = project.hasProperty('voxyLoomCache')
                ? new File(project.property('voxyLoomCache'))
                : new File(rootProject.projectDir.parentFile, "voxy-clone/.gradle/loom-cache/remapped_mods")
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against local Voxy and Modrinth Sodium/Iris
    compileOnly "maven.modrinth:sodium:mc1.21.11-0.8.11-fabric"
    compileOnly "maven.modrinth:iris:1.10.7+1.21.11-fabric"
    compileOnly files('libs/voxy-stripped.jar')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// MapNative loads one artifact per OS from src/main/resources/natives, and whatever
// is committed there is what a release jar ships. On macOS we therefore build a slice
// per architecture and lipo them into a single universal dylib, so a jar built on an
// Apple Silicon machine still runs on Intel. Other platforms do a plain host build.
// Cross-compiling needs rustup (Homebrew's `rust` formula ships host std only):
//   rustup target add aarch64-apple-darwin x86_64-apple-darwin
def isMacOS = System.getProperty('os.name').toLowerCase().contains('mac')
def macNativeTargets = ['aarch64-apple-darwin', 'x86_64-apple-darwin']
def nativesDir = file('src/main/resources/natives')

def nativeSlices = isMacOS
        ? macNativeTargets.collect { triple ->
            tasks.register("buildMapNative-${triple}", Exec) {
                workingDir 'map-native'
                commandLine 'cargo', 'build', '--release', '--target', triple
            }
        }
        : [tasks.register('buildMapNativeHost', Exec) {
            workingDir 'map-native'
            commandLine 'cargo', 'build', '--release'
        }]

task buildMapNative {
    dependsOn nativeSlices
}

if (isMacOS) {
    tasks.register('copyMapNative', Exec) {
        dependsOn buildMapNative
        workingDir 'map-native'
        commandLine(['lipo', '-create', '-output', new File(nativesDir, 'libmap_native.dylib').path]
                + macNativeTargets.collect { "target/${it}/release/libmap_native.dylib".toString() })
        // lipo emits 0755, which shows up as a spurious git mode change on every Mac build. The
        // loader extracts from the jar, so the executable bit is meaningless here — normalise it to
        // match the committed .dll and keep rebuilds out of the diff.
        doLast {
            new File(nativesDir, 'libmap_native.dylib').setExecutable(false, false)
        }
    }
} else {
    tasks.register('copyMapNative', Copy) {
        dependsOn buildMapNative
        from 'map-native/target/release'
        include '*.dll', '*.so', '*.dylib'
        into nativesDir
    }
}
processResources.dependsOn copyMapNative
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn copyMapNative }

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Modrinth publishing (Minotaur). Run `./gradlew modrinth` to upload the built jar.
// Needs: MODRINTH_TOKEN env var, and -Pmodrinth_project_id=<slug> (or set it in gradle.properties)
// after creating the project on modrinth.com. Normal `./gradlew build` never needs these.
modrinth {
    token = providers.environmentVariable("MODRINTH_TOKEN")
    projectId = providers.gradleProperty("modrinth_project_id")
    versionNumber = project.mod_version
    versionName = "MIA Maps ${project.mod_version}"
    versionType = "beta"
    uploadFile = tasks.named("remapJar")
    gameVersions = ["1.21.11"]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        // Voxy MIA fork: uncomment + set the real Modrinth slug/id if it is ever listed there.
        // required.project "voxy-mia-edition"
    }
    syncBodyFrom = rootProject.file("docs/modrinth/description.md").text
}
