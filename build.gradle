plugins {
    id 'fabric-loom'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name "caffeinemcRepository"
                url "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    // Local loom mapping cache + sibling voxy-clone loom cache, derived at build time
    // (no hardcoded user paths). Override the voxy cache with -PvoxyLoomCache=... if it
    // lives elsewhere.
    maven { url = new File(System.getProperty('user.home'), ".gradle/caches/fabric-loom/minecraftMaven") }
    // This project's own loom caches. Loom writes the remapped Minecraft/fabric-api
    // artifacts here but does not always register them for resolution (seen on
    // Loom 1.16.3 + Gradle 9.4.1), so declare them explicitly.
    maven { url = new File(rootProject.projectDir, ".gradle/loom-cache/minecraftMaven") }
    maven { url = new File(rootProject.projectDir, ".gradle/loom-cache/remapped_mods") }
    maven {
        url = project.hasProperty('voxyLoomCache')
                ? new File(project.property('voxyLoomCache'))
                : new File(rootProject.projectDir.parentFile, "voxy-clone/.gradle/loom-cache/remapped_mods")
    }
    mavenCentral()
}

// Resolved once so the chosen path can be reported; see the compileOnly entry below for why.
def voxyApiJar = {
    if (project.hasProperty('voxyDevJar')) return file(project.property('voxyDevJar'))
    def devlibs = new File(rootProject.projectDir.parentFile, 'mia-voxy-rust/build/devlibs')
    def found = devlibs.isDirectory()
            ? devlibs.listFiles({ File f -> f.name.endsWith('-dev.jar') } as java.io.FileFilter)
            : null
    if (found != null && found.length > 0) return found[0]
    return file('libs/voxy-stripped.jar')
}()
logger.lifecycle("Voxy API surface: ${voxyApiJar}")

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against local Voxy and Modrinth Sodium/Iris
    compileOnly "maven.modrinth:sodium:mc1.21.11-0.8.11-fabric"
    compileOnly "maven.modrinth:iris:1.10.7+1.21.11-fabric"
    // Voxy API surface to compile against (compileOnly — never bundled, never redistributed).
    //
    // Prefer a sibling fork checkout's Mojang-mapped DEV jar, so a new fork API is usable as soon as
    // the fork is rebuilt — no hand-stripped artifact to regenerate per machine, which is what made
    // adding a fork API a cross-machine chore. Falls back to libs/voxy-stripped.jar so existing
    // setups keep working unchanged. Override with -PvoxyDevJar=/path/to/<fork>-dev.jar
    //
    // The fork is "Copyright 2025 MCRcortex, All rights reserved, Do not redistribute", and this
    // repo is PUBLIC — so neither jar may be committed. libs/ stays gitignored deliberately.
    compileOnly files(voxyApiJar)

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// MapNative loads one artifact per OS from src/main/resources/natives, and whatever
// is committed there is what a release jar ships. On macOS we therefore build a slice
// per architecture and lipo them into a single universal dylib, so a jar built on an
// Apple Silicon machine still runs on Intel. Other platforms do a plain host build.
// Cross-compiling needs rustup (Homebrew's `rust` formula ships host std only):
//   rustup target add aarch64-apple-darwin x86_64-apple-darwin
def isMacOS = System.getProperty('os.name').toLowerCase().contains('mac')
def macNativeTargets = ['aarch64-apple-darwin', 'x86_64-apple-darwin']
def nativesDir = file('src/main/resources/natives')

// A Mac can also cross-build the WINDOWS native, so one machine produces every artifact the jar
// ships and neither platform has to remember to rebuild the other's. Needs the mingw-w64 linker
// (`brew install mingw-w64`) and `rustup target add x86_64-pc-windows-gnu`; skipped silently when
// absent, so this stays optional.
//
// The resulting DLL imports only Windows system libraries and the UCRT (verified with objdump) — no
// libgcc/libwinpthread to ship alongside — but it is ~2 MB against ~360 KB for an MSVC build,
// because the Rust runtime links statically. That trade buys single-machine releases.
def WINDOWS_TRIPLE = 'x86_64-pc-windows-gnu'
def hasMingw = {
    try {
        def p = new ProcessBuilder('x86_64-w64-mingw32-gcc', '--version').start()
        return p.waitFor() == 0
    } catch (Exception ignored) {
        return false
    }
}()
def crossWindows = isMacOS && hasMingw
if (isMacOS) {
    logger.lifecycle("Windows native cross-build: ${crossWindows ? 'enabled' : 'disabled (mingw-w64 not found)'}")
}

def nativeSlices = isMacOS
        ? (macNativeTargets + (crossWindows ? [WINDOWS_TRIPLE] : [])).collect { triple ->
            tasks.register("buildMapNative-${triple}", Exec) {
                workingDir 'map-native'
                commandLine 'cargo', 'build', '--release', '--target', triple
            }
        }
        : [tasks.register('buildMapNativeHost', Exec) {
            workingDir 'map-native'
            commandLine 'cargo', 'build', '--release'
        }]

task buildMapNative {
    dependsOn nativeSlices
}

// ---- mia-lods: the LOD store, built from a sibling checkout -------------------------------------
//
// OPTIONAL by design. The store is being introduced alongside the existing data path, so a clone
// without the sibling must build exactly as before rather than failing — LodNative simply reports
// unavailable and callers skip the feature. Override the location with -PmiaLodsDir=<path>.
def miaLodsDir = {
    if (project.hasProperty('miaLodsDir')) return file(project.property('miaLodsDir'))
    return new File(rootProject.projectDir.parentFile, 'mia-lods-rust')
}()
def hasMiaLods = new File(miaLodsDir, 'Cargo.toml').isFile()
logger.lifecycle("mia-lods: ${hasMiaLods ? "building from ${miaLodsDir}" : 'not found — LOD store will be unavailable'}")

if (hasMiaLods) {
    // Same target set as map-native, so one Mac build still produces every native the jar ships.
    def lodTriples = isMacOS ? (macNativeTargets + (crossWindows ? [WINDOWS_TRIPLE] : [])) : []
    def lodSlices = lodTriples.isEmpty()
            ? [tasks.register('buildMiaLodsHost', Exec) {
                workingDir miaLodsDir
                commandLine 'cargo', 'build', '--release'
            }]
            : lodTriples.collect { triple ->
                tasks.register("buildMiaLods-${triple}", Exec) {
                    workingDir miaLodsDir
                    commandLine 'cargo', 'build', '--release', '--target', triple
                }
            }

    tasks.register('copyMiaLods') {
        dependsOn lodSlices
        doLast {
            def put = { File src, String name ->
                if (!src.isFile()) return
                def dst = new File(nativesDir, name)
                java.nio.file.Files.copy(src.toPath(), dst.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                dst.setExecutable(false, false)
            }
            if (isMacOS) {
                // Universal dylib, same reasoning as map-native: one artifact covering both Macs.
                def slices = macNativeTargets.collect {
                    new File(miaLodsDir, "target/${it}/release/libmia_lods.dylib").path
                }
                // ProcessBuilder rather than Gradle's exec {}: project.exec at execution time is
                // removed in Gradle 9, and an Exec task cannot be conditional on a doLast branch.
                def cmd = ['lipo', '-create', '-output',
                           new File(nativesDir, 'libmia_lods.dylib').path] + slices
                def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
                def out = proc.inputStream.text
                if (proc.waitFor() != 0) {
                    throw new GradleException("lipo failed for mia-lods: ${out}")
                }
                new File(nativesDir, 'libmia_lods.dylib').setExecutable(false, false)
                if (crossWindows) {
                    put(new File(miaLodsDir, "target/${WINDOWS_TRIPLE}/release/mia_lods.dll"), 'mia_lods.dll')
                }
            } else {
                put(new File(miaLodsDir, 'target/release/mia_lods.dll'), 'mia_lods.dll')
                put(new File(miaLodsDir, 'target/release/libmia_lods.so'), 'libmia_lods.so')
                put(new File(miaLodsDir, 'target/release/libmia_lods.dylib'), 'libmia_lods.dylib')
            }
        }
    }
    processResources.dependsOn 'copyMiaLods'
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'copyMiaLods' }
}

if (isMacOS) {
    tasks.register('copyMapNative', Exec) {
        dependsOn buildMapNative
        workingDir 'map-native'
        commandLine(['lipo', '-create', '-output', new File(nativesDir, 'libmap_native.dylib').path]
                + macNativeTargets.collect { "target/${it}/release/libmap_native.dylib".toString() })
        // lipo emits 0755, which shows up as a spurious git mode change on every Mac build. The
        // loader extracts from the jar, so the executable bit is meaningless here — normalise it to
        // match the committed .dll and keep rebuilds out of the diff.
        doLast {
            new File(nativesDir, 'libmap_native.dylib').setExecutable(false, false)
            // Cross-built Windows native, when the toolchain is present, so a Mac build refreshes
            // every native the jar ships rather than leaving the .dll to go stale.
            if (crossWindows) {
                def dll = file("map-native/target/${WINDOWS_TRIPLE}/release/map_native.dll")
                if (dll.exists()) {
                    java.nio.file.Files.copy(dll.toPath(), new File(nativesDir, 'map_native.dll').toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    new File(nativesDir, 'map_native.dll').setExecutable(false, false)
                }
            }
        }
    }
} else {
    tasks.register('copyMapNative', Copy) {
        dependsOn buildMapNative
        from 'map-native/target/release'
        include '*.dll', '*.so', '*.dylib'
        into nativesDir
    }
}
processResources.dependsOn copyMapNative

// copyMapNative writes INTO src/main/resources, which is processResources' OWN input directory.
// Gradle fingerprints that input before the write lands, so processResources reports UP-TO-DATE and
// packages the PREVIOUS native — producing a jar whose Java declares methods the bundled dylib does
// not export, i.e. UnsatisfiedLinkError at runtime with a perfectly green build.
//
// This has now shipped a stale native twice (the fork's makeExcludedRocksDB was the same shape), so
// it is handled structurally rather than by remembering to clean. processResources is a file copy —
// always running it costs nothing next to a wrong jar.
processResources.outputs.upToDateWhen { false }

// Belt and braces: fail the build if the packaged native is not the one we just produced. The
// standing lesson from these two incidents is that a green build proves nothing about natives —
// verify the artifact.
// Checks EVERY native, not just this platform's: Windows ships map_native.dll and hits exactly the
// same trap, and a dylib-only check would have left it unguarded.
processResources.doLast {
    def sha = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
    nativesDir.listFiles()?.each { File src ->
        if (!(src.name ==~ /.*\.(dll|dylib|so)$/)) return
        def packaged = new File(sourceSets.main.output.resourcesDir, "natives/${src.name}")
        if (packaged.exists() && sha(src) != sha(packaged)) {
            throw new GradleException("Packaged natives/${src.name} does not match ${src} (packaged copy is " +
                    "stale). This ships a jar whose Java and native disagree — rebuild rather than ignoring this.")
        }
    }
}
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn copyMapNative }

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Modrinth publishing (Minotaur). Run `./gradlew modrinth` to upload the built jar.
// Needs: MODRINTH_TOKEN env var, and -Pmodrinth_project_id=<slug> (or set it in gradle.properties)
// after creating the project on modrinth.com. Normal `./gradlew build` never needs these.
modrinth {
    token = providers.environmentVariable("MODRINTH_TOKEN")
    projectId = providers.gradleProperty("modrinth_project_id")
    versionNumber = project.mod_version
    versionName = "MIA Maps ${project.mod_version}"
    versionType = "beta"
    uploadFile = tasks.named("remapJar")
    gameVersions = ["1.21.11"]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        // Voxy MIA fork: uncomment + set the real Modrinth slug/id if it is ever listed there.
        // required.project "voxy-mia-edition"
    }
    syncBodyFrom = rootProject.file("docs/modrinth/description.md").text
}
